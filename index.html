<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>課金封印SAVE</title>
<style>
body{margin:0;background:#111827;color:white;font-family:system-ui;text-align:center}
main{max-width:500px;margin:auto;padding:25px 15px}
h1{font-size:32px}
.card{background:#1f2937;border-radius:20px;padding:20px;margin:15px 0}
.total{font-size:48px;font-weight:bold}
.bar{height:15px;background:#374151;border-radius:20px;margin:15px 0;overflow:hidden}
#bar{height:100%;width:0;background:#facc15;transition:.5s}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:15px;padding:18px;font-size:20px;font-weight:bold;color:white;background:#7c3aed}
button:active{transform:scale(.95)}
input{padding:15px;border-radius:12px;border:0;font-size:18px;width:55%;margin-top:12px}
.custom{background:#db2777;margin-top:10px}
#effect{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:40px;font-weight:bold;color:#fde047;text-shadow:0 0 20px #f97316;pointer-events:none}
</style>
</head>
<body>
<main>
<h1>💰 課金封印SAVE</h1>
<p>課金したつもりで、未来の自分に貯金。</p>

<div class="card">
<p>現在の貯金額</p>
<div class="total" id="total">¥0</div>
<div class="bar"><div id="bar"></div></div>
<div id="level">Lv.1 貯金ビギナー</div>
</div>

<div class="card">
<p>💥 課金したくなった金額をSAVE！</p>
<div class="buttons">
<button onclick="save(500)">+¥500</button>
<button onclick="save(1000)">+¥1,000</button>
<button onclick="save(2000)">+¥2,000</button>
<button onclick="save(3000)">+¥3,000</button>
<button onclick="save(5000)">+¥5,000</button>
<button onclick="save(10000)">+¥10,000</button>
</div>
<input id="amount" type="number" placeholder="好きな金額">
<button class="custom" onclick="customSave()">SAVE</button>
</div>

<div class="card">
<p>今日のSAVE：<b id="today">¥0</b></p>
<p>SAVE回数：<b id="count">0回</b></p>
</div>
</main>

<div id="effect">PERFECT SAVE!!</div>

<script>
let total=+localStorage.total||0;
let today=+localStorage.today||0;
let count=+localStorage.count||0;

function update(){
 document.getElementById("total").textContent="¥"+total.toLocaleString();
 document.getElementById("today").textContent="¥"+today.toLocaleString();
 document.getElementById("count").textContent=count+"回";
 document.getElementById("bar").style.width=Math.min(total/10000,100)+"%";
 let l=total>=1000000?"🏆 Lv.MAX 100万円達成！！":total>=500000?"🔥 Lv.5 貯金マスター":total>=300000?"⚡ Lv.4 貯金戦士":total>=100000?"💪 Lv.3 貯金ファイター":total>=50000?"✨ Lv.2 貯金ルーキー":"Lv.1 貯金ビギナー";
 document.getElementById("level").textContent=l;
 localStorage.total=total;
 localStorage.today=today;
 localStorage.count=count;
}

 function save(n){
  total+=n;
  today+=n;
  count++;
  update();

  let e=document.getElementById("effect");
  e.innerHTML="💥 PERFECT SAVE!!<br><small>+¥"+n.toLocaleString()+" SAVE!</small>";
  e.style.display="flex";
  navigator.vibrate?.([80,40,120,40,180]);

  for(let i=0;i<20;i++){
    let c=document.createElement("div");
    c.textContent=["🪙","💰","✨","⭐"][Math.floor(Math.random()*4)];
    c.style.position="fixed";
    c.style.left=(10+Math.random()*80)+"%";
    c.style.top=(20+Math.random()*20)+"%";
    c.style.fontSize=(25+Math.random()*25)+"px";
    c.style.zIndex="999";
    c.style.transition="1s";
    document.body.appendChild(c);

    setTimeout(()=>{
      c.style.transform="translateY(350px) rotate(720deg)";
      c.style.opacity="0";
    },30);

    setTimeout(()=>c.remove(),1100);
  }

  playSaveSound();

  setTimeout(()=>e.style.display="none",1000);
}



function playSaveSound(){
  try{
    const A=window.AudioContext||window.webkitAudioContext;
    const ctx=new A();

    const notes=[
      [392,0],
      [523,0.08],
      [659,0.16],
      [784,0.24],
      [1047,0.34]
    ];

    notes.forEach(([freq,time])=>{
      const o=ctx.createOscillator();
      const g=ctx.createGain();

      o.type="square";
      o.frequency.value=freq;

      g.gain.setValueAtTime(0.001,ctx.currentTime+time);
      g.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+time+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+time+0.16);

      o.connect(g);
      g.connect(ctx.destination);

      o.start(ctx.currentTime+time);
      o.stop(ctx.currentTime+time+0.18);
    });

    setTimeout(()=>ctx.close(),1000);
  }catch(e){}
}function customSave(){
 let n=+document.getElementById("amount").value;
 if(n>0){save(n);document.getElementById("amount").value=""}
}

update();
</script>
</body>
</html>
